<fieldset><legend>Planificación</legend>
  <label for="{{ prefijo }}responsable">Responsable</label>
  <select id="{{ prefijo }}responsable" name="{{ prefijo }}responsable"><option value="">Sin responsable</option>{% for c in cargos %}<option value="{{ c.pk }}" {% if obj.responsable_id == c.pk %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}</select>
  <label for="{{ prefijo }}estado_plan">Estado</label>
  <select id="{{ prefijo }}estado_plan" name="{{ prefijo }}estado_plan">{% for k, n in estados %}<option value="{{ k }}" {% if obj.estado_plan == k %}selected{% endif %}>{{ n }}</option>{% endfor %}</select>
  <label for="{{ prefijo }}fecha_inicio">Fecha de inicio</label><input id="{{ prefijo }}fecha_inicio" type="date" name="{{ prefijo }}fecha_inicio" value="{{ obj.fecha_inicio|date:'Y-m-d' }}">
  <label for="{{ prefijo }}fecha_termino">Fecha de término</label><input id="{{ prefijo }}fecha_termino" type="date" name="{{ prefijo }}fecha_termino" value="{{ obj.fecha_termino|date:'Y-m-d' }}">
  <label for="{{ prefijo }}observaciones">Observaciones</label><textarea id="{{ prefijo }}observaciones" name="{{ prefijo }}observaciones" rows="2">{{ obj.observaciones }}</textarea>
</fieldset>
