{% extends "nucleo/base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<section class="tarjeta tarjeta-angosta">
  <h1>Ingresar</h1>
  <form method="post">{% csrf_token %}
    {% if form.non_field_errors %}<p class="error" role="alert">{{ form.non_field_errors.0 }}</p>{% endif %}
    <label for="id_username">Usuario</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus>
    <label for="id_password">Contraseña</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="boton">Ingresar</button>
  </form>
  {% if modo_prueba %}<p class="meta"><a href="{% url 'acceso_rapido' %}">Entrar sin clave (solo prueba local)</a></p>{% endif %}
</section>
{% endblock %}
