# /etc/nginx/sites-available/planificacion   (sitio propio; no toca el del Arqueo)
# Va SOLO con el puerto 80 a propósito: si se declara 443 sin certificado, `nginx -t` falla
# y se traba también la recarga del Arqueo. `certbot --nginx -d planificacion.finanzashuentelauquen.cl --redirect`
# agrega el 443, las líneas del certificado y la redirección de HTTP a HTTPS.
server {
    listen 80;
    server_name planificacion.finanzashuentelauquen.cl;

    client_max_body_size 12m;   # los adjuntos admiten hasta 10 MB
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    access_log /var/log/nginx/planificacion.access.log;
    error_log  /var/log/nginx/planificacion.error.log;

    location /static/ {
        alias /var/www/planificacion/static/;
        expires 7d;
    }
    # /admin/ de Django no pasa por el segundo factor: queda cerrado hasta que se decida otra cosa.
    location /admin/ {
        return 404;
    }
    # Los adjuntos NO se sirven desde nginx: los entrega la aplicación solo a quien corresponde.
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
