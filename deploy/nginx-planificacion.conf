# /etc/nginx/sites-available/planificacion  (enlazar en sites-enabled y luego `certbot --nginx -d TU.DOMINIO`)
# Reemplaza planificacion.example.cl por el dominio que defina Eugenio.
server {
    listen 80;
    server_name planificacion.example.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name planificacion.example.cl;
    # certbot completa estas líneas:
    # ssl_certificate     /etc/letsencrypt/live/planificacion.example.cl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/planificacion.example.cl/privkey.pem;

    client_max_body_size 12m;   # los adjuntos admiten hasta 10 MB
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /var/www/planificacion/static/;
        expires 7d;
    }
    # Los adjuntos NO se sirven desde nginx: los entrega la aplicación solo a quien corresponde.
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
